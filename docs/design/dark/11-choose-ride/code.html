    if (category === 'eco') {
      ecoCard.classList.remove('bg-surface-container-lowest');

      comfCard.classList.remove('bg-[#FFFDF7]');
      comfCard.classList.add('bg-surface-container-lowest');

      ctaLabel.textContent = 'اطلب اقتصادي';
    } else {
      comfCard.classList.remove('bg-surface-container-lowest');
      comfCard.classList.add('bg-[#FFFDF7]');

      ecoCard.classList.remove('bg-[#FFFDF7]');
      ecoCard.classList.add('bg-surface-container-lowest');

      ctaLabel.textContent = 'اطلب مريح';
