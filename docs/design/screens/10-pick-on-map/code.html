 { "lineHeight": "20px", "fontWeight": "600" }] } } } }</script></head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button class="min-w-[44px] min-h-[44px] flex items-center justify-center text-on-surface hover:text-on-surface-variant transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_forward</span></button><h1 class="text-headline-sm font-headline-sm text-on-surface truncate">Ride Selection</h1></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-safe bg-surface"><div class="flex flex-col w-full relative select-none overflow-hidden" style="height: calc(100vh - 4rem);">
<!-- Full Screen Realistic Vector Map Layer (Erbil, Kurdistan Region) -->
<div class="absolute inset-0 z-0 bg-[#F4F1EA] overflow-hidden cursor-grab active:cursor-grabbing" id="map-canvas">
<svg class="w-full h-full object-cover" fill="none" viewbox="0 0 390 750" xmlns="http://www.w3.org/2000/svg">
<rect fill="#F4F2EB" height="750" width="390"></rect>
<!-- Urban Landuse & Parks -->
<path d="M-20 40 C60 30, 110 90, 90 180 C70 270, -10 250, -20 220 Z" fill="#E5ECD9" opacity="0.9"></path>
<path d="M280 120 C330 110, 390 140, 410 220 C380 280, 310 260, 270 210 Z" fill="#E5ECD9" opacity="0.8"></path>
<path d="M40 520 C90 500, 140 530, 130 600 C100 660, 30 640, 20 580 Z" fill="#E8EFEB" opacity="0.85"></path>
<circle cx="195" cy="360" fill="#FAF7F0" r="140" stroke="#EBE6DA" stroke-width="2"></circle>
<!-- Citadel Zone (Qalat Erbil outline) -->
<circle cx="195" cy="355" fill="#E9E2D0" r="54" stroke="#DFD6C0" stroke-width="2"></circle>
<!-- Secondary Streets Network -->
<path d="M-10 110 L410 130" stroke="#FFFFFF" stroke-linecap="round" stroke-width="7"></path>
<path d="M-10 110 L410 130" stroke="#E2DDD2" stroke-dasharray="8 6" stroke-width="1.5"></path>
<path d="M-20 620 L400 580" stroke="#FFFFFF" stroke-linecap="round" stroke-width="8"></path>
<path d="M-20 620 L400 580" stroke="#DDD6C8" stroke-width="1.5"></path>
<path d="M80 -20 L70 760" stroke="#FFFFFF" stroke-linecap="round" stroke-width="7"></path>
<path d="M80 -20 L70 760" stroke="#DDD7C9" stroke-width="1.5"></path>
<path d="M310 -10 L320 760" stroke="#FFFFFF" stroke-linecap="round" stroke-width="8"></path>
<path d="M310 -10 L320 760" stroke="#DDD7C9" stroke-width="1.5"></path>
<!-- Major Arterial Ring Roads (60m & 30m Road corridors) -->
<ellipse cx="195" cy="360" rx="165" ry="165" stroke="#FFFFFF" stroke-width="13"></ellipse>
<ellipse cx="195" cy="360" rx="165" ry="165" stroke="#D5CEBE" stroke-width="2"></ellipse>
<ellipse cx="195" cy="360" rx="98" ry="98" stroke="#FFFFFF" stroke-width="10"></ellipse>
<ellipse cx="195" cy="360" rx="98" ry="98" stroke="#D8D1C2" stroke-width="1.5"></ellipse>
<!-- Radial Boulevards (Barzani Blvd, Kirkuk Rd, Gulan St) -->
<path d="M195 360 L195 -30" stroke="#FFF9EB" stroke-linecap="round" stroke-width="11"></path>
<path d="M195 360 L195 -30" stroke="#E5CE9F" stroke-width="2"></path>
<path d="M195 360 L195 760" stroke="#FFF9EB" stroke-linecap="round" stroke-width="11"></path>
<path d="M195 360 L195 760" stroke="#E5CE9F" stroke-width="2"></path>
<path d="M195 360 L420 220" stroke="#FFF9EB" stroke-linecap="round" stroke-width="10"></path>
<path d="M195 360 L-30 490" stroke="#FFF9EB" stroke-linecap="round" stroke-width="10"></path>
<path d="M195 360 L-30 250" stroke="#FFFFFF" stroke-width="8"></path>
<path d="M195 360 L410 470" stroke="#FFFFFF" stroke-width="8"></path>
<!-- Local Kurdish & Arabic Map Typography -->
<text fill="#716755" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="195" y="348">قلعة أربيل التاريخية</text>
<text fill="#8C8270" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="9" text-anchor="middle" x="195" y="363">Qelay Hewlêr</text>
<text fill="#8F8778" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="9" font-weight="600" text-anchor="middle" x="195" y="210">شارع 30 متري</text>
<text fill="#8F8778" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="9" font-weight="600" text-anchor="middle" x="195" y="535">شارع 60 متري</text>
<text fill="#8A947A" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="9" font-weight="600" text-anchor="middle" x="290" y="80">حديقة شاندر</text>
<text fill="#8F8778" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="8.5" text-anchor="middle" x="330" y="340">طريق كركوك</text>
<text fill="#8F8778" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="8.5" text-anchor="middle" x="65" y="390">طريق الموصل</text>
</svg>
</div>
<!-- Top Floating Controls Layer -->
<div class="relative z-20 flex items-center justify-between px-margin pt-3 pointer-events-none">
<!-- Floating Back Button (Right in RTL) -->
<button aria-label="رجوع" class="pointer-events-auto w-11 h-11 bg-surface-white rounded-xl shadow-md flex items-center justify-center text-on-surface active:scale-95 transition-transform" onclick="history.back()" style="box-shadow: 0 4px 14px rgba(5,7,15,0.08);">
<span class="material-symbols-outlined text-[22px]">arrow_forward</span>
</button>
<!-- Map Search Shortcut Pill -->
<div class="pointer-events-auto bg-surface-white/95 backdrop-blur-md px-3.5 py-2 rounded-full shadow-sm flex items-center gap-2 text-on-surface">
<span class="material-symbols-outlined text-primary text-[18px]">search</span>
<span class="font-label-md text-label-md text-on-surface font-medium">أربيل، شارع 60</span>
</div>
</div>
<!-- Centered Interactive Drop-off Pin -->
<div class="absolute inset-0 z-20 flex flex-col items-center justify-center pointer-events-none pb-28">
<!-- Floating Instructional Tooltip -->
<div class="mb-2 bg-on-surface text-surface-white px-3.5 py-1.5 rounded-full shadow-lg flex items-center gap-1.5 transition-all duration-300 transform -translate-y-1" id="pin-tooltip">
<span class="material-symbols-outlined text-[#F3D59A] text-[15px]">touch_app</span>
<span class="font-label-sm text-label-sm tracking-normal">حرّك الخريطة لتحديد الموقع بدقة</span>
</div>
<!-- Drop-off Marker Assembly -->
<div class="relative flex flex-col items-center cursor-pointer group">
<!-- Gold Flag Head -->
<div class="w-11 h-11 bg-primary-container rounded-xl shadow-md flex items-center justify-center relative z-10 transform transition-transform group-hover:scale-105" style="box-shadow: 0 6px 16px rgba(113,91,44,0.28);">
<span class="material-symbols-outlined text-[#05070F] text-[24px]" style="font-variation-settings: 'FILL' 1;">flag</span>
</div>
<!-- Needle Point -->
<div class="w-[3px] h-5 bg-[#05070F] rounded-b-full -mt-0.5 z-10"></div>
<!-- Realistic Needle Shadow on Road -->
<div class="w-4 h-2 bg-[#05070F]/25 rounded-full blur-[2px] mt-0.5"></div>
</div>
</div>
<!-- Secondary Actions & Floating Recentre Button (Above Bottom Sheet) -->
<div class="mt-auto relative z-20 px-margin pb-3 flex items-end justify-between pointer-events-none">
<!-- Recentre Floating Trigger Button -->
<button aria-label="إعادة التمركز" class="pointer-events-auto w-11 h-11 bg-surface-white rounded-xl shadow-md flex items-center justify-center text-on-surface active:bg-surface-inset transition-colors" id="recentre-btn" style="box-shadow: 0 4px 16px rgba(5,7,15,0.12);">
<span class="material-symbols-outlined text-[22px] text-on-surface">my_location</span>
</button>
<!-- Map Layer / Landmark Info Badge -->
<div class="bg-surface-white/90 backdrop-blur-sm px-3 py-1.5 rounded-lg shadow-sm flex items-center gap-1.5 pointer-events-auto">
<span class="w-2 h-2 rounded-full bg-status-success animate-pulse"></span>
<span class="font-label-sm text-label-sm text-ink-secondary">نظام تحديد المواقع نشط</span>
</div>
</div>
<!-- Bottom Details Drawer / Sheet -->
<div class="relative z-30 w-full bg-surface-white rounded-t-[24px] px-margin pt-3 pb-6 flex flex-col" style="box-shadow: 0 -8px 24px rgba(5, 7, 15, 0.10);">
<!-- Drag Pill Indicator -->
<div class="w-10 h-1 bg-[#E6E2D8] rounded-full mx-auto mb-3.5"></div>
<!-- Header Row: Place Name, Icon & Favorite Toggle -->
<div class="flex items-center justify-between gap-3 mb-2.5">
<div class="flex items-center gap-3 min-w-0">
<!-- Place Badge Icon Container -->
<div class="w-10 h-10 rounded-xl bg-[#F1EFE9] flex items-center justify-center shrink-0 text-on-surface">
<span class="material-symbols-outlined text-[22px] text-tertiary" style="font-variation-settings: 'FILL' 1;">near_me</span>
</div>
<!-- Destination Title -->
<div class="min-w-0">
<h2 class="font-headline-sm text-headline-sm text-[#05070F] truncate font-bold leading-snug">
            جمعية إقليم كردستان للسياحة
          </h2>
<span class="font-label-sm text-label-sm text-primary font-medium">وجهة شائعة وموثوقة</span>
</div>
</div>
<!-- Save to Favorites Button -->
<button aria-label="حفظ في المفضلة" class="w-10 h-10 rounded-xl bg-surface-inset flex items-center justify-center text-ink-secondary hover:text-error active:scale-90 transition-all shrink-0" id="favorite-btn">
<span class="material-symbols-outlined text-[20px]" id="heart-icon">favorite</span>
</button>
</div>
<!-- Multi-line Address Info -->
<div class="bg-canvas-base rounded-xl p-3 mb-4 space-y-1">
<div class="flex items-start gap-2">
<span class="material-symbols-outlined text-[16px] text-ink-secondary shrink-0 mt-0.5">pin_drop</span>
<p class="font-body-md text-body-md text-secondary font-medium leading-tight">
          شارع 60 متري، بالقرب من قلعة أربيل التاريخية
        </p>
</div>
<div class="flex items-center gap-2 pr-6">
<p class="font-body-sm text-body-sm text-ink-secondary">
          أربيل، إقليم كردستان، العراق
        </p>
</div>
</div>
<!-- Primary Destination Confirm Button -->
<button class="w-full h-[52px] bg-primary-container hover:brightness-95 active:scale-[0.99] text-[#05070F] font-label-lg text-label-lg rounded-[14px] font-semibold flex items-center justify-center gap-2 transition-all shadow-sm" id="confirm-btn">
<span>تأكيد الوجهة</span>
<span class="material-symbols-outlined text-[20px]">check</span>
</button>
</div>
</div>
<script>
  // Simple micro-interactions for delightful native app feel
  (function() {
    const favoriteBtn = document.getElementById('favorite-btn');
    const heartIcon = document.getElementById('heart-icon');
    let isFavorited = false;

    if (favoriteBtn && heartIcon) {
      favoriteBtn.addEventListener('click', () => {
        isFavorited = !isFavorited;
        if (isFavorited) {
          heartIcon.style.fontVariationSettings = "'FILL' 1";
          heartIcon.classList.add('text-error');
          favoriteBtn.classList.add('bg-error-container/40');
        } else {
          heartIcon.style.fontVariationSettings = "'FILL' 0";
          heartIcon.classList.remove('text-error');
          favoriteBtn.classList.remove('bg-error-container/40');
        }
      });
    }

    const recentreBtn = document.getElementById('recentre-btn');
    const tooltip = document.getElementById('pin-tooltip');
    if (recentreBtn && tooltip) {
      recentreBtn.addEventListener('click', () => {
        recentreBtn.classList.add('rotate-45');
        tooltip.classList.remove('-translate-y-1');
        tooltip.classList.add('-translate-y-3', 'bg-primary', 'text-on-primary');
        setTimeout(() => {
          recentreBtn.classList.remove('rotate-45');
          tooltip.classList.remove('-translate-y-3', 'bg-primary', 'text-on-primary');
          tooltip.classList.add('-translate-y-1');
        }, 600);
      });
    }

    const confirmBtn = document.getElementById('confirm-btn');
    if (confirmBtn) {
      confirmBtn.addEventListener('click', function() {
        this.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span><span>جاري الحجز...</span>';
        setTimeout(() => {
          this.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle</span><span>تم تحديد الوجهة بنجاح</span>';
          this.classList.add('bg-status-success-bg', 'text-status-success');
        }, 800);
      });
    }
  })();
</script></main></body></html>
