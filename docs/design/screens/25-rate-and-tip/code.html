<div class="inline-flex items-center gap-space-xs bg-surface-inset px-3 py-1 rounded-full text-secondary font-label-md text-label-md">

<!-- Interactive 5-Star Rating Section -->

<!-- 1st Star (Active) -->
<button aria-label="تقييم 1 من 5" class="star-btn transition-transform active:scale-90 p-1 text-primary-container" data-index="1" type="button">

</button>
<!-- 2nd Star (Active) -->
<button aria-label="تقييم 2 من 5" class="star-btn transition-transform active:scale-90 p-1 text-primary-container" data-index="2" type="button">
<span class="material-symbols-outlined text-[36px]" style="font-variation-settings: 'FILL' 1;">star</span>
</button>
<!-- 3rd Star (Active) -->
<button aria-label="تقييم 3 من 5" class="star-btn transition-transform active:scale-90 p-1 text-primary-container" data-index="3" type="button">
<span class="material-symbols-outlined text-[36px]" style="font-variation-settings: 'FILL' 1;">star</span>
</button>

<button aria-label="تقييم 4 من 5" class="star-btn transition-transform active:scale-90 p-1 text-primary-container" data-index="4" type="button">

<div class="flex flex-col gap-space-sm pt-1">
<div class="flex flex-wrap gap-2 justify-center" id="tags-container">
<!-- Selected Chip 1 -->
<button class="tag-chip px-4 py-2 rounded-full font-label-md text-label-md transition-all active:scale-95 bg-inverse-surface text-inverse-on-surface shadow-sm" type="button">

      </button>
<!-- Selected Chip 2 -->
<button class="tag-chip px-4 py-2 rounded-full font-label-md text-label-md transition-all active:scale-95 bg-inverse-surface text-inverse-on-surface shadow-sm" type="button">

      </button>
<!-- Unselected Chip 3 -->
<button class="tag-chip px-4 py-2 rounded-full font-label-md text-label-md transition-all active:scale-95 bg-surface-inset text-on-surface" type="button">

<button class="tag-chip px-4 py-2 rounded-full font-label-md text-label-md transition-all active:scale-95 bg-surface-inset text-on-surface" type="button">

</button>
<!-- Option: 1,000 IQD (Selected) -->

<span dir="ltr">1,000 د.ع</span>

</button>

<p class="font-body-sm text-body-sm leading-tight text-secondary">
        الإكرامية تذهب كاملة للكابتن من محفظتك
      </p>
</div>
</div>
<!-- Primary Submit Action -->
<div class="pt-3 pb-2 w-full">
<button class="w-full h-[52px] bg-primary-container text-on-surface font-label-lg text-label-lg rounded-[14px] flex items-center justify-center font-semibold shadow-sm hover:brightness-95 active:scale-[0.99] transition-all" id="submit-rating-btn" type="button">
      إرسال
    </button>
</div>
</div>
<!-- Client Micro-Interactions -->
<script>
  // Star rating selector logic
  const stars = document.querySelectorAll('.star-btn');
  const ratingLabel = document.getElementById('rating-label');
  const ratingTexts = ['بحاجة لتحسين', 'مقبول', 'جيد', 'جيد جداً', 'ممتاز ومثالي'];

  stars.forEach((star) => {
    star.addEventListener('click', (e) => {
      const selectedIndex = parseInt(star.getAttribute('data-index'), 10);
      stars.forEach((s) => {
        const idx = parseInt(s.getAttribute('data-index'), 10);
        const icon = s.querySelector('.material-symbols-outlined');
        if (idx <= selectedIndex) {
          s.classList.remove('text-outline-variant');
          s.classList.add('text-primary-container');
          icon.style.fontVariationSettings = "'FILL' 1";
        } else {
          s.classList.add('text-outline-variant');
          s.classList.remove('text-primary-container');
          icon.style.fontVariationSettings = "'FILL' 0";
        }
      });
      if (ratingLabel && ratingTexts[selectedIndex - 1]) {
        ratingLabel.textContent = ratingTexts[selectedIndex - 1];
      }
    });
  });

  // Feedback Tags Toggle logic
  const chips = document.querySelectorAll('.tag-chip');
  chips.forEach((chip) => {
    chip.addEventListener('click', () => {
      const isSelected = chip.classList.contains('bg-inverse-surface');
      if (isSelected) {
        chip.classList.remove('bg-inverse-surface', 'text-inverse-on-surface', 'shadow-sm');
        chip.classList.add('bg-surface-inset', 'text-on-surface');
      } else {
        chip.classList.add('bg-inverse-surface', 'text-inverse-on-surface', 'shadow-sm');
        chip.classList.remove('bg-surface-inset', 'text-on-surface');
      }
    });
  });

  // Tip Selector logic
  const tipOptions = document.querySelectorAll('.tip-option');
  tipOptions.forEach((option) => {
    option.addEventListener('click', () => {
      tipOptions.forEach((opt) => {
        opt.classList.remove('bg-inverse-surface', 'text-inverse-on-surface', 'shadow-sm');
        opt.classList.add('bg-surface-inset', 'text-on-surface');
      });
      option.classList.remove('bg-surface-inset', 'text-on-surface');
      option.classList.add('bg-inverse-surface', 'text-inverse-on-surface', 'shadow-sm');
    });
  });

  // Submit Feedback trigger
  const submitBtn = document.getElementById('submit-rating-btn');
  if (submitBtn) {
    submitBtn.addEventListener('click', () => {
      submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>';
      setTimeout(() => {
        submitBtn.textContent = 'تم الإرسال بنجاح';
        submitBtn.classList.remove('bg-primary-container');
        submitBtn.classList.add('bg-surface-inset', 'text-secondary');
      }, 600);
    });
  }
</script></main><div class="fixed bottom-0 inset-x-0 z-50 pointer-events-none pb-safe"><div class="h-4 flex items-center justify-center"><div class="w-32 h-1 bg-on-surface/20 rounded-full"></div></div></div></body></html>
