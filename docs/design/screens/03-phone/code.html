<!-- Interactive Keypad Logic -->
<script>
    (function() {
      let rawDigits = "7501234567";
      const displayEl = document.getElementById("phone-display");
      const clearBtn = document.getElementById("clear-phone");
      const backspaceBtn = document.getElementById("key-backspace");
      const keys = document.querySelectorAll(".keypad-key[data-key]");

      function formatDigits(val) {
        if (!val) return "7XX XXX XXXX";
        const clean = val.replace(/\D/g, "").slice(0, 10);
        let out = "";
        if (clean.length > 0) out += clean.slice(0, 3);
        if (clean.length > 3) out += " " + clean.slice(3, 6);
        if (clean.length > 6) out += " " + clean.slice(6, 10);
        return out;
      }

      function update() {
        if (!rawDigits) {
          displayEl.textContent = "7XX XXX XXXX";
          displayEl.classList.add("text-on-surface-variant/40");
          displayEl.classList.remove("text-on-surface");
        } else {
          displayEl.textContent = formatDigits(rawDigits);
          displayEl.classList.remove("text-on-surface-variant/40");
          displayEl.classList.add("text-on-surface");
        }
      }

      keys.forEach(k => {
        k.addEventListener("click", () => {
          const val = k.getAttribute("data-key");
          if (val && /^\d$/.test(val) && rawDigits.length < 10) {
            rawDigits += val;
            update();
          }
        });
      });

      backspaceBtn.addEventListener("click", () => {
        if (rawDigits.length > 0) {
          rawDigits = rawDigits.slice(0, -1);
          update();
        }
      });

      clearBtn.addEventListener("click", () => {
        rawDigits = "";
        update();
      });

      update();
    })();
  </script>
