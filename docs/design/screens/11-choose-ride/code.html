 { "lineHeight": "20px", "fontWeight": "600" }] } } } }</script></head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button class="min-w-[44px] min-h-[44px] flex items-center justify-center text-on-surface hover:text-on-surface-variant transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_forward</span></button><h1 class="text-headline-sm font-headline-sm text-on-surface truncate">Ride Selection</h1></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-safe bg-surface"><div class="flex flex-col w-full relative select-none">

<img class="w-full h-full object-contain p-1" data-alt="Clean minimal vector side-view illustration of a white compact modern family taxi sedan on a soft clean off-white background, Iraqi transit style, crisp shadows" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCd8dPQOhLdtXLSZBY_TKFVUdBWd3kTCkFfPFSbkM1g9JsrSagQqHC1cZ2_-ezz31iTdXh6dd_aZ2-FCea0rZw-K_bGW95zo8YBjRtSjhMNFDhGLYRShpds_koQGQZx0DX8hYtOiFD4xS2yOxYo7s_Ww8Rc7a4PkjL1TVLisjYtBwhQUkw3MMqJ27x5XVcN6P0V5Ap_E5SHIhP16D-KadcJaCOaZ1cncH7ULVyAgYg2PhGoxdi7xe9S"/>
</div>
<!-- Center & Right Details -->
<div class="flex-1 px-3 min-w-0">

</div>
<!-- Price Details (Left in RTL alignment discipline) -->

</div>
<!-- Center & Right Details -->
<div class="flex-1 px-3 min-w-0">
<div class="flex items-center gap-1.5">
<span class="text-headline-sm font-headline-sm text-on-surface font-bold">مريح</span>
</div>

</div>
</div>
<!-- Price Details -->
<div class="flex flex-col items-end text-left shrink-0">

<!-- Row of Three Compact Control Chips (40px height) -->
<div class="grid grid-cols-3 gap-2 w-full pt-1">

<!-- Coupon Chip with Green Active Indicator Dot -->
<button class="h-10 px-2 rounded-full bg-[#F1EFE9] flex items-center justify-center gap-1.5 text-on-surface relative active:bg-surface-variant transition-colors">

</button>

<script>
  function selectRide(category) {
    const ecoCard = document.getElementById('option-eco');
    const comfCard = document.getElementById('option-comfort');
    const ctaLabel = document.getElementById('primary-cta-label');

    if (category === 'eco') {
      ecoCard.classList.remove('bg-surface-container-lowest');
      ecoCard.classList.add('bg-[#FFFDF7]');

      comfCard.classList.remove('bg-[#FFFDF7]');
      comfCard.classList.add('bg-surface-container-lowest');

      ctaLabel.textContent = 'اطلب اقتصادي';
    } else {
      comfCard.classList.remove('bg-surface-container-lowest');
      comfCard.classList.add('bg-[#FFFDF7]');

      ecoCard.classList.remove('bg-[#FFFDF7]');
      ecoCard.classList.add('bg-surface-container-lowest');

      ctaLabel.textContent = 'اطلب مريح';
    }
  }
</script></main></body></html>
