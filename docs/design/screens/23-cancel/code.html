<div class="absolute inset-0 bg-gradient-to-b from-surface/30 via-surface/60 to-surface"></div>

<div class="flex items-center gap-space-sm min-w-0">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center shrink-0">

<div class="flex flex-col min-w-0">

</div>
</div>
<div class="bg-surface-inset px-2.5 py-1 rounded-lg shrink-0 flex items-center gap-1.5" dir="ltr">
<span class="font-plate-display text-plate-display text-on-surface tracking-wider">21 B 48910</span>
<span class="font-label-sm text-label-sm text-ink-secondary px-1 bg-surface-white rounded">أربيل</span>
</div>
</div>
</div>
<!-- Bottom Sheet Card Modal -->
<div class="bg-surface-white rounded-t-[28px] shadow-xl pt-3 px-margin pb-6 -mt-6 relative z-10 flex flex-col">
<!-- Sheet Drag Handle -->
<div class="w-12 h-1.5 bg-outline-variant/60 rounded-full self-center mb-4"></div>
<!-- Header Section -->
<div class="flex items-center justify-between mb-space-md">
<div class="flex items-center gap-2">
<button aria-label="رجوع" class="w-9 h-9 rounded-full bg-surface-inset flex items-center justify-center text-on-surface active:scale-95 transition-transform" onclick="history.back()" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<h2 class="font-headline-md text-headline-md text-on-surface">ليش بدك تلغي؟</h2>
</div>
<span class="font-body-sm text-body-sm text-ink-secondary bg-surface-inset px-2.5 py-1 rounded-full">أربيل • تاكسي</span>
</div>
<!-- Cancellation Reasons (Radio Form) -->
<div aria-label="أسباب إلغاء المشوار" class="flex flex-col gap-2.5 mb-space-lg" role="radiogroup">
<!-- Option 1 -->
<label class="flex items-center justify-between p-3.5 rounded-xl bg-surface-inset cursor-pointer active:scale-[0.99] transition-all">
<div class="flex items-center gap-3">
<div class="w-5 h-5 rounded-full bg-surface-white flex items-center justify-center">
<input class="sr-only peer" name="cancel_reason" type="radio" value="captain_late"/>
<div class="w-2.5 h-2.5 rounded-full bg-primary opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
<span class="font-label-lg text-label-lg text-on-surface">الكابتن تأخر</span>
</div>
<span class="material-symbols-outlined text-ink-secondary text-[20px]">schedule</span>
</label>
<!-- Option 2 -->
<label class="flex items-center justify-between p-3.5 rounded-xl bg-surface-inset cursor-pointer active:scale-[0.99] transition-all">
<div class="flex items-center gap-3">
<div class="w-5 h-5 rounded-full bg-surface-white flex items-center justify-center">
<input class="sr-only peer" name="cancel_reason" type="radio" value="changed_mind"/>
<div class="w-2.5 h-2.5 rounded-full bg-primary opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
<span class="font-label-lg text-label-lg text-on-surface">غيّرت رأيي</span>
</div>
<span class="material-symbols-outlined text-ink-secondary text-[20px]">change_circle</span>
</label>
<!-- Option 3 -->
<label class="flex items-center justify-between p-3.5 rounded-xl bg-surface-inset cursor-pointer active:scale-[0.99] transition-all">
<div class="flex items-center gap-3">
<div class="w-5 h-5 rounded-full bg-surface-white flex items-center justify-center">
<input class="sr-only peer" name="cancel_reason" type="radio" value="accidental_request"/>
<div class="w-2.5 h-2.5 rounded-full bg-primary opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
<span class="font-label-lg text-label-lg text-on-surface">طلبت بالغلط</span>
</div>
<span class="material-symbols-outlined text-ink-secondary text-[20px]">touch_app</span>
</label>
<!-- Option 4 -->
<label class="flex items-center justify-between p-3.5 rounded-xl bg-surface-inset cursor-pointer active:scale-[0.99] transition-all">
<div class="flex items-center gap-3">
<div class="w-5 h-5 rounded-full bg-surface-white flex items-center justify-center">
<input class="sr-only peer" name="cancel_reason" type="radio" value="driver_asked"/>
<div class="w-2.5 h-2.5 rounded-full bg-primary opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
<span class="font-label-lg text-label-lg text-on-surface">الكابتن طلب الإلغاء</span>
</div>
<span class="material-symbols-outlined text-ink-secondary text-[20px]">call</span>
</label>
<!-- Option 5: Selected by Default with Active Input Field -->
<div class="flex flex-col p-3.5 rounded-xl bg-tertiary-fixed/30 transition-all">
<label class="flex items-center justify-between cursor-pointer mb-2.5">
<div class="flex items-center gap-3">
<div class="w-5 h-5 rounded-full bg-surface-white flex items-center justify-center shadow-xs">
<input checked="" class="sr-only peer" name="cancel_reason" type="radio" value="other"/>
<div class="w-2.5 h-2.5 rounded-full bg-primary opacity-100"></div>
</div>
<span class="font-label-lg text-label-lg text-on-surface">سبب آخر</span>
</div>
<span class="material-symbols-outlined text-primary text-[20px]">edit_note</span>
</label>
<!-- Open Text Input -->
<div class="w-full">
<textarea class="w-full bg-surface-white rounded-xl p-3 font-body-md text-body-md text-on-surface placeholder:text-ink-secondary focus:outline-none resize-none shadow-sm" placeholder="اكتب السبب هنا..." rows="2"></textarea>
</div>
</div>
</div>
<!-- Cancellation Fee Amber Warning Banner (10% Warning Tint) -->
<div class="bg-status-warning-bg rounded-xl p-3.5 mb-space-lg flex items-start gap-3">
<div class="w-8 h-8 rounded-full bg-status-warning/15 flex items-center justify-center shrink-0 mt-0.5">
<span class="material-symbols-outlined text-status-warning text-[20px]" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-status-warning mb-0.5">تنبيه رسوم الإلغاء</span>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">
          سيتم احتساب رسوم إلغاء <span class="font-numeral-price text-on-surface">1,000 د.ع</span> لأن الكابتن في الطريق منذ أكثر من <span class="font-numeral-price text-on-surface">2</span> دقيقة.
        </p>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-2.5 w-full">
<!-- Destructive Danger Button (Solid #DC2626) -->
<button class="w-full h-[52px] rounded-xl bg-status-error text-on-error font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-sm active:opacity-90 active:scale-[0.99] transition-all" id="confirm-cancel-btn" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
<span>إلغاء الرحلة</span>
</button>
<!-- Secondary Retain Button -->
<button class="w-full h-[52px] rounded-xl bg-surface-inset text-on-surface font-label-lg text-label-lg flex items-center justify-center gap-2 active:bg-surface-container active:scale-[0.99] transition-all" onclick="history.back()" type="button">
<span class="material-symbols-outlined text-[20px]">local_taxi</span>
<span>الرجوع للرحلة</span>
</button>
</div>
</div>
<script>
    (function() {
      const radioLabels = document.querySelectorAll('input[name="cancel_reason"]');
      const otherContainer = document.querySelector('textarea').closest('div.flex-col');
      
      radioLabels.forEach(radio => {
        radio.addEventListener('change', (e) => {
          document.querySelectorAll('input[name="cancel_reason"]').forEach(r => {
            const dot = r.parentElement.querySelector('div');
            if (dot) dot.classList.replace('opacity-100', 'opacity-0');
            const parentCard = r.closest('label')?.parentElement;
            if (parentCard && parentCard !== otherContainer) {
              parentCard.classList.remove('bg-tertiary-fixed/30');
            }
          });
          
          const currentDot = e.target.parentElement.querySelector('div');
          if (currentDot) currentDot.classList.replace('opacity-0', 'opacity-100');
        });
      });

      const cancelBtn = document.getElementById('confirm-cancel-btn');
      if (cancelBtn) {
        cancelBtn.addEventListener('click', () => {
          cancelBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span><span>جاري الإلغاء...</span>';
          setTimeout(() => {
            if (window.history.length > 1) {
              window.history.back();
            }
          }, 800);
        });
      }
    })();
  </script>
