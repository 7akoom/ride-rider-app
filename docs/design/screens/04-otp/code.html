<script>
  // Simple countdown timer tick for delight
  (function() {
    let timeLeft = 45;
    const timerElem = document.getElementById('countdown-timer');
    const resendBtn = document.getElementById('resend-sms-btn');
    if (!timerElem || !resendBtn) return;

    const interval = setInterval(() => {
      timeLeft--;
      if (timeLeft <= 0) {
        clearInterval(interval);
        timerElem.textContent = '0:00';
        resendBtn.disabled = false;
        resendBtn.classList.remove('opacity-60', 'cursor-not-allowed');
        resendBtn.classList.add('hover:underline', 'cursor-pointer');
      } else {
        const secs = timeLeft < 10 ? '0' + timeLeft : timeLeft;
        timerElem.textContent = '0:' + secs;
      }
    }, 1000);
  })();
