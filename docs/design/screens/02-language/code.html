ight">9:41</span><div class="flex items-center gap-1.5 opacity-90"><span class="material-symbols-outlined text-[15px]">signal_cellular_alt</span><span class="material-symbols-outlined text-[15px]">wifi</span><span class="material-symbols-outlined text-[18px]">battery_full</span></div></div><main class="flex-1 flex flex-col relative w-full bg-surface pt-11 pb-safe"><div class="flex flex-col w-full px-gutter pb-6 pt-4 justify-between" dir="rtl">
<!-- Content Top Area -->
<div class="flex flex-col w-full">
<!-- Header Greeting & Typography -->
<div class="flex flex-col gap-1.5 mb-7">
<div class="flex items-center gap-2 mb-1">
<span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-secondary-container text-on-secondary-container">
<span class="material-symbols-outlined text-[18px]">translate</span>
</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider text-primary">تفضيلات الواجهة</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface font-semibold tracking-tight">
        اختر لغتك
      </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
        اختر لغة التطبيق المفضلة للمتابعة
      </p>
</div>
<!-- Visual Language Selection Cards Stack -->
<div aria-label="اختيار لغة التطبيق" class="flex flex-col gap-space-md w-full" id="language-options" role="radiogroup">
<!-- Option 1: Arabic (Selected Default) -->
<div aria-checked="true" class="lang-card group relative flex items-center justify-between p-5 rounded-xl cursor-pointer transition-all duration-200 select-none bg-surface-container-lowest shadow-sm ring-2 ring-primary-container" data-lang="ar" role="radio" tabindex="0">
<div class="flex items-center gap-3.5 min-w-0">
<div class="w-10 h-10 rounded-full flex items-center justify-center bg-secondary-container/40 text-on-secondary-container shrink-0 font-headline-sm text-headline-sm font-semibold">
            ع
          </div>
<div class="flex flex-col min-w-0">
<span class="font-headline-md text-headline-md font-semibold text-on-surface leading-snug">العربية</span>
<span class="font-label-md text-label-md text-primary font-medium">اللغة الافتراضية</span>
</div>
</div>
<!-- Custom Radio Indicator (Active) -->
<div class="radio-indicator flex items-center justify-center w-6 h-6 rounded-full bg-secondary-container shrink-0 transition-colors">
<div class="radio-dot w-2.5 h-2.5 rounded-full bg-on-background transition-transform scale-100"></div>
</div>
</div>
<!-- Option 2: Kurdish Sorani -->
<div aria-checked="false" class="lang-card group relative flex items-center justify-between p-5 rounded-xl cursor-pointer transition-all duration-200 select-none bg-surface-container-lowest shadow-sm hover:bg-surface-container-low" data-lang="ku" role="radio" tabindex="0">
<div class="flex items-center gap-3.5 min-w-0">
<div class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container text-tertiary shrink-0 font-headline-sm text-headline-sm font-semibold">
            ک
          </div>
<div class="flex flex-col min-w-0">
<span class="font-headline-md text-headline-md font-semibold text-on-surface leading-snug">کوردی</span>
<span class="font-label-md text-label-md text-tertiary">سۆرانی</span>
</div>
</div>
<!-- Custom Radio Indicator (Inactive) -->
<div class="radio-indicator flex items-center justify-center w-6 h-6 rounded-full bg-surface-container-highest shrink-0 transition-colors">
<div class="radio-dot w-2.5 h-2.5 rounded-full bg-on-background transition-transform scale-0"></div>
</div>
</div>
<!-- Option 3: English -->
<div aria-checked="false" class="lang-card group relative flex items-center justify-between p-5 rounded-xl cursor-pointer transition-all duration-200 select-none bg-surface-container-lowest shadow-sm hover:bg-surface-container-low" data-lang="en" role="radio" tabindex="0">
<div class="flex items-center gap-3.5 min-w-0">
<div class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container text-tertiary shrink-0 font-headline-sm text-headline-sm font-semibold">
            En
          </div>
<div class="flex flex-col min-w-0">
<span class="font-headline-md text-headline-md font-semibold text-on-surface leading-snug" dir="ltr">English</span>
<span class="font-label-md text-label-md text-tertiary" dir="ltr">LTR interface</span>
</div>
</div>
<!-- Custom Radio Indicator (Inactive) -->
<div class="radio-indicator flex items-center justify-center w-6 h-6 rounded-full bg-surface-container-highest shrink-0 transition-colors">
<div class="radio-dot w-2.5 h-2.5 rounded-full bg-on-background transition-transform scale-0"></div>
</div>
</div>
</div>
<!-- Microcopy / Subtext Information -->
<div class="flex items-center justify-center gap-1.5 mt-5 text-center">
<span class="material-symbols-outlined text-[16px] text-tertiary">info</span>
<p class="font-label-md text-label-md text-tertiary">
        يمكنك تغييرها لاحقاً من الإعدادات
      </p>
</div>
<!-- Refined Decorative Erbil Corridor Heritage Stamp -->
<div class="mt-8 flex items-center justify-center gap-3 opacity-30 select-none">
<div class="h-px w-10 bg-outline-variant"></div>
<span class="font-label-sm text-label-sm uppercase tracking-widest text-on-surface-variant">خدمة نقل موثوقة للجميع</span>
<div class="h-px w-10 bg-outline-variant"></div>
</div>
</div>
<!-- Bottom Interactive CTA Area -->
<div class="w-full mt-10">
<button class="w-full h-[52px] rounded-xl bg-secondary-fixed text-on-secondary-fixed font-headline-sm text-headline-sm font-semibold flex items-center justify-center gap-2 active:opacity-90 active:scale-[0.99] transition-all shadow-sm" id="continue-button" type="button" style="background-color: rgb(243, 213, 154); color: rgb(5, 7, 15);">
<span class="">متابعة</span>
<span class="material-symbols-outlined text-[20px] transition-transform rtl:rotate-180">arrow_forward</span>
</button>
</div>
</div>
<script>
  (function initLanguagePicker() {
    const cards = document.querySelectorAll('.lang-card');
    const continueBtn = document.getElementById('continue-button');
    let selectedLang = 'ar';

    cards.forEach(card => {
      card.addEventListener('click', () => {
        selectCard(card);
      });

      card.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          selectCard(card);
        }
      });
    });

    function selectCard(activeCard) {
      cards.forEach(card => {
        const isCurrent = card === activeCard;
        card.setAttribute('aria-checked', isCurrent ? 'true' : 'false');
        
        const radioIndicator = card.querySelector('.radio-indicator');
        const radioDot = card.querySelector('.radio-dot');
        const avatar = card.querySelector('div:first-child > div:first-child');
        
        if (isCurrent) {
          card.classList.add('ring-2', 'ring-primary-container');
          card.classList.remove('hover:bg-surface-container-low');
          
          radioIndicator.classList.remove('bg-surface-container-highest');
          radioIndicator.classList.add('bg-secondary-container');
          
          radioDot.classList.remove('scale-0');
          radioDot.classList.add('scale-100');

          avatar.classList.remove('bg-surface-container', 'text-tertiary');
          avatar.classList.add('bg-secondary-container/40', 'text-on-secondary-container');
          
          selectedLang = card.getAttribute('data-lang');
        } else {
          card.classList.remove('ring-2', 'ring-primary-container');
          card.classList.add('hover:bg-surface-container-low');

          radioIndicator.classList.remove('bg-secondary-container');
          radioIndicator.classList.add('bg-surface-container-highest');
          
          radioDot.classList.remove('scale-100');
          radioDot.classList.add('scale-0');

          avatar.classList.add('bg-surface-container', 'text-tertiary');
          avatar.classList.remove('bg-secondary-container/40', 'text-on-secondary-container');
        }
      });
    }

    if (continueBtn) {
      continueBtn.addEventListener('click', () => {
        // Haptic feel via micro-interaction
        continueBtn.style.transform = 'scale(0.97)';
        setTimeout(() => {
          continueBtn.style.transform = '';
        }, 120);
      });
    }
  })();
</script></main><div class="fixed bottom-1 inset-x-0 flex justify-center items-center pointer-events-none z-50"><div class="w-32 h-1 bg-on-surface/20 rounded-full"></div></div>
