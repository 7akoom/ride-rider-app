<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-background": "#191b24", "on-primary-container": "#fff2e0", "inverse-primary": "#e9c179", "tertiary-fixed": "#dfe1f5", "surface-bright": "#faf8ff", "surface-container-highest": "#e1e2ee", "outline-variant": "#d1c5b4", "primary": "#6f5214", "inverse-on-surface": "#eff0fd", "primary-fixed-dim": "#e9c179", "on-secondary": "#ffffff", "tertiary": "#525666", "on-secondary-fixed": "#261a00", "surface-container-lowest": "#ffffff", "on-primary-fixed": "#271900", "surface-container-low": "#f2f3ff", "on-error-container": "#93000a", "background": "#faf8ff", "secondary-fixed": "#fddfa3", "surface": "#faf8ff", "outline": "#807667", "primary-fixed": "#ffdea7", "on-primary-fixed-variant": "#5d4203", "error": "#ba1a1a", "on-secondary-fixed-variant": "#584416", "secondary-fixed-dim": "#e0c389", "surface-container": "#ecedfa", "on-tertiary-fixed-variant": "#424656", "on-secondary-container": "#786131", "surface-dim": "#d8d9e6", "error-container": "#ffdad6", "on-primary": "#ffffff", "surface-variant": "#e1e2ee", "surface-tint": "#78591c", "primary-container": "#8a6a2b", "secondary-container": "#fddfa3", "on-tertiary-fixed": "#171b29", "inverse-surface": "#2e303a", "tertiary-container": "#6b6e7f", "tertiary-fixed-dim": "#c3c6d8", "on-error": "#ffffff", "on-surface": "#191b24", "on-tertiary-container": "#f2f2ff", "surface-container-high": "#e6e7f4", "secondary": "#715b2c", "on-surface-variant": "#4e4639", "on-tertiary": "#ffffff" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-xs": "4px", "space-md": "12px", "margin": "20px", "gutter": "16px", "space-xl": "24px", "space-lg": "16px", "space-sm": "8px" }, fontFamily: { "label-sm": ["IBM Plex Sans"], "body-sm": ["IBM Plex Sans"], "body-lg": ["IBM Plex Sans"], "headline-sm": ["IBM Plex Sans"], "headline-md": ["IBM Plex Sans"], "label-lg": ["IBM Plex Sans"], "headline-lg": ["IBM Plex Sans"], "numeral-price": ["IBM Plex Sans"], "body-md": ["IBM Plex Sans"], "plate-display": ["IBM Plex Sans"], "headline-xl": ["IBM Plex Sans"], "label-md": ["IBM Plex Sans"] }, fontSize: { "label-sm": ["11px", { "lineHeight": "14px", "fontWeight": "500" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "headline-sm": ["17px", { "lineHeight": "24px", "fontWeight": "600" }], "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "label-lg": ["15px", { "lineHeight": "20px", "fontWeight": "500" }], "headline-lg": ["26px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "numeral-price": ["18px", { "lineHeight": "22px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "plate-display": ["14px", { "lineHeight": "18px", "letterSpacing": "0.08em", "fontWeight": "700" }], "headline-xl": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "label-md": ["13px", { "lineHeight": "18px", "fontWeight": "500" }] } } } };</script><style>@layer base{html,body{width:100vw;min-height:100vh;margin:0;padding:0;}body{overscroll-behavior:none;font-family:'IBM Plex Sans',sans-serif;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,34px);}.pt-safe{padding-top:env(safe-area-inset-top,44px);}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen relative selection:bg-secondary-container"><header class="fixed top-0 inset-x-0 z-50 bg-surface/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-11 px-5 flex items-center justify-between text-on-surface pointer-events-none select-none" dir="ltr"><span class="font-label-md text-label-md font-semibold tracking-tight">9:41</span><div class="flex items-center gap-1.5 opacity-90"><span class="material-symbols-outlined text-[15px]">signal_cellular_alt</span><span class="material-symbols-outlined text-[15px]">wifi</span><span class="material-symbols-outlined text-[18px]">battery_full</span></div></div><div class="h-16 px-4 flex items-center justify-between"><div class="flex items-center gap-3"><button aria-label="رجوع" class="w-11 h-11 flex items-center justify-center rounded-xl text-on-surface hover:bg-surface-container transition-colors active:scale-95" onclick="history.back()"><span class="material-symbols-outlined text-2xl">arrow_forward</span></button></div></div></header><main class="flex-1 flex flex-col relative w-full px-5 pt-16 bg-surface pb-safe"><div class="flex flex-col w-full pb-6" dir="rtl">
<!-- Friendly Welcoming Visual Card -->
<div class="relative w-full rounded-xl bg-surface-container-low p-5 shadow-sm overflow-hidden mb-6 mt-2">
<div class="absolute -left-6 -top-6 w-28 h-28 rounded-full bg-secondary-container/40 blur-xl pointer-events-none"></div>
<div class="flex items-start justify-between relative z-10">
<div class="flex-1 pr-1">

<h2 class="font-headline-lg text-headline-lg text-on-surface tracking-tight mb-1">
          شو اسمك؟
        </h2>
<p class="font-body-lg text-body-lg text-on-surface-variant leading-relaxed">
          هيك رح يشوفك الكابتن لمن يوصلك
        </p>
</div>
<div class="w-14 h-14 rounded-xl bg-surface-container-lowest shadow-sm flex items-center justify-center text-primary shrink-0 self-center">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">badge</span>
</div>
</div>
</div>
<!-- Form Fields Container -->
<form class="flex flex-col gap-5 w-full" id="onboarding-name-form" onsubmit="event.preventDefault();">
<!-- Field 1: First Name -->
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center justify-between px-1" for="first-name">
<span class="">الاسم الأول</span>
<span class="font-label-sm text-label-sm text-primary font-medium">مطلوب</span>
</label>
<div class="relative flex items-center w-full h-[52px] rounded-xl bg-surface-container shadow-sm focus-within:bg-surface-container-lowest transition-all duration-200">
<span class="material-symbols-outlined text-primary text-[20px] pr-4 select-none pointer-events-none">person</span>
<input autocomplete="given-name" class="w-full h-full bg-transparent px-3 text-on-surface font-body-lg text-body-lg outline-none placeholder:text-outline" id="first-name" placeholder="مثال: علي" type="text" value="علي">
<button aria-label="مسح الاسم الأول" class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:text-on-surface active:scale-90 pl-3 transition-transform" id="clear-first-name" type="button" style="visibility: visible;">
<span class="material-symbols-outlined text-[19px] p-1 rounded-full bg-surface-container-highest">close</span>
</button>
</div>
</div>
<!-- Field 2: Last Name -->
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="last-name">
        اسم العائلة
      </label>
<div class="relative flex items-center w-full h-[52px] rounded-xl bg-surface-container shadow-sm focus-within:bg-surface-container-lowest transition-all duration-200">
<span class="material-symbols-outlined text-tertiary text-[20px] pr-4 select-none pointer-events-none">family_restroom</span>
<input autocomplete="family-name" class="w-full h-full bg-transparent px-3 text-on-surface font-body-lg text-body-lg outline-none placeholder:text-outline" id="last-name" placeholder="مثال: الكردي" type="text">
</div>
</div>
<!-- Field 3: Email Address -->
<div class="flex flex-col gap-1.5 w-full">
<div class="flex items-center justify-between px-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="user-email">
          البريد الإلكتروني
        </label>
<span class="font-label-sm text-label-sm text-tertiary">اختياري</span>
</div>
<div class="relative flex items-center w-full h-[52px] rounded-xl bg-surface-container shadow-sm focus-within:bg-surface-container-lowest transition-all duration-200">
<span class="material-symbols-outlined text-tertiary text-[20px] pr-4 select-none pointer-events-none">mail</span>
<input autocomplete="email" class="w-full h-full bg-transparent px-3 text-on-surface font-body-lg text-body-lg outline-none placeholder:text-outline text-right focus:text-left" dir="ltr" id="user-email" placeholder="name@example.com" type="email">
</div>
</div>
<!-- Privacy & Trust Reassurance -->
<div class="flex items-center gap-2.5 px-3 py-3 rounded-xl bg-surface-container-low text-on-surface-variant mt-1">
<div class="w-7 h-7 rounded-full bg-surface-container-highest flex items-center justify-center shrink-0 text-primary">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">verified_user</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-tight">
        لن نشارك بياناتك أو رقمك مع أي طرف ثالث. خصوصيتك أمانة.
      </p>
</div>
<!-- Interactive Driver Preview Bubble -->

<!-- Primary Action Button -->
<div class="pt-4 mt-auto">
<button class="w-full h-[52px] rounded-xl bg-secondary-container text-on-secondary-fixed font-headline-sm text-headline-sm font-semibold flex items-center justify-center gap-2 shadow-md hover:bg-secondary-fixed active:scale-[0.98] transition-all cursor-pointer" id="submit-name-btn" type="button" style="background-color: rgb(243, 213, 154); color: rgb(5, 7, 15);">
<span class="">ابدأ</span>
<span class="material-symbols-outlined text-[20px] transition-transform -scale-x-100">arrow_forward</span>
</button>
</div>
</form>
</div>
<script>
  (function () {
    const firstNameInput = document.getElementById('first-name');
    const lastNameInput = document.getElementById('last-name');
    const clearBtn = document.getElementById('clear-first-name');
    const previewName = document.getElementById('preview-display-name');
    const avatarInitial = document.getElementById('avatar-initial');

    function updatePreview() {
      const first = (firstNameInput.value || '').trim();
      const last = (lastNameInput.value || '').trim();
      const full = [first, last].filter(Boolean).join(' ');

      if (full.length > 0) {
        previewName.textContent = full;
        avatarInitial.textContent = first.length > 0 ? first.charAt(0) : full.charAt(0);
      } else {
        previewName.textContent = 'ضيف كريم';
        avatarInitial.textContent = 'ض';
      }

      if (clearBtn) {
        clearBtn.style.visibility = first.length > 0 ? 'visible' : 'hidden';
      }
    }

    if (firstNameInput) {
      firstNameInput.addEventListener('input', updatePreview);
    }
    if (lastNameInput) {
      lastNameInput.addEventListener('input', updatePreview);
    }

    if (clearBtn && firstNameInput) {
      clearBtn.addEventListener('click', function () {
        firstNameInput.value = '';
        firstNameInput.focus();
        updatePreview();
      });
    }

    updatePreview();
  })();
</script></main><div class="fixed bottom-1 inset-x-0 flex justify-center items-center pointer-events-none z-50"><div class="w-32 h-1 bg-on-surface/20 rounded-full"></div></div>

</body></html>
