<!DOCTYPE html>

<html dir="rtl" lang="ar"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#faf8ff;font-family:'IBM Plex Sans Arabic',sans-serif;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-background": "#191b24", "surface-container-highest": "#e1e1ee", "on-tertiary": "#ffffff", "primary": "#715b2c", "on-tertiary-fixed": "#271900", "inverse-primary": "#e0c389", "on-surface-variant": "#4d463a", "secondary-container": "#dedfec", "primary-fixed-dim": "#e0c389", "surface": "#faf8ff", "status-warning": "#B35C00", "outline": "#7e7669", "background": "#faf8ff", "inverse-surface": "#2e303a", "status-warning-bg": "#FFF4E5", "ink-secondary": "#5C606E", "outline-variant": "#cfc5b6", "surface-container": "#ededfa", "error-container": "#ffdad6", "on-secondary": "#ffffff", "tertiary-fixed": "#ffdea7", "tertiary": "#78591c", "on-primary-fixed-variant": "#584416", "on-primary-fixed": "#261a00", "status-error-bg": "#FDF2F2", "on-secondary-container": "#60626d", "on-primary": "#ffffff", "secondary-fixed-dim": "#c5c6d2", "on-primary-container": "#715b2c", "status-success": "#1B5E3B", "on-secondary-fixed-variant": "#444651", "inverse-on-surface": "#f0f0fd", "surface-tint": "#715b2c", "secondary-fixed": "#e1e2ee", "status-success-bg": "#E8F3EC", "surface-bright": "#faf8ff", "on-tertiary-container": "#77591c", "on-error": "#ffffff", "border-hairline": "#E5E2DC", "surface-container-high": "#e7e7f4", "on-secondary-fixed": "#191b24", "surface-container-lowest": "#ffffff", "status-error": "#9E1C1C", "tertiary-container": "#fcd389", "canvas-base": "#F9F8F5", "surface-dim": "d9d9e6", "secondary": "#5c5e69", "primary-fixed": "#fddfa3", "on-tertiary-fixed-variant": "#5d4203", "error": "#ba1a1a", "tertiary-fixed-dim": "#e9c179", "on-error-container": "#93000a", "primary-container": "#f3d59a", "surface-container-low": "#f3f2ff", "on-surface": "#191b24", "surface-inset": "#F2EFEB", "surface-variant": "#e1e1ee", "surface-white": "#FFFFFF" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-xl": "1.5rem", "space-lg": "1rem", "space-xs": "0.25rem", "space-md": "0.75rem", "gutter": "1rem", "margin": "1.25rem", "space-sm": "0.5rem" }, fontFamily: { "headline-lg": ["IBM Plex Sans"], "plate-display": ["IBM Plex Sans"], "body-sm": ["IBM Plex Sans"], "label-sm": ["IBM Plex Sans"], "headline-md": ["IBM Plex Sans"], "label-lg": ["IBM Plex Sans"], "numeral-price": ["IBM Plex Sans"], "body-lg": ["IBM Plex Sans"], "headline-xl": ["IBM Plex Sans"], "headline-sm": ["IBM Plex Sans"], "body-md": ["IBM Plex Sans"], "label-md": ["IBM Plex Sans"] }, fontSize: { "headline-lg": ["26px", { lineHeight: "34px", letterSpacing: "-0.01em", fontWeight: "600" }], "plate-display": ["14px", { lineHeight: "18px", letterSpacing: "0.08em", fontWeight: "700" }], "body-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }], "label-sm": ["11px", { lineHeight: "14px", fontWeight: "500" }], "headline-md": ["20px", { lineHeight: "28px", fontWeight: "600" }], "label-lg": ["16px", { lineHeight: "20px", fontWeight: "600" }], "numeral-price": ["18px", { lineHeight: "22px", letterSpacing: "-0.01em", fontWeight: "700" }], "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }], "headline-xl": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "600" }], "headline-sm": ["17px", { lineHeight: "24px", fontWeight: "600" }], "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }], "label-md": ["14px", { lineHeight: "18px", fontWeight: "500" }] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-14 px-margin flex items-center justify-between"><button aria-label="رجوع" class="w-11 h-11 flex items-center justify-center text-on-surface active:opacity-70" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_forward</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface text-center flex-1 pr-space-xs">Active Ride</h1><div class="w-11 h-11 flex items-center justify-center"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full pt-14 pb-safe bg-surface"><div class="flex flex-col w-full relative">
<!-- Interactive Map Canvas Layer -->
<div class="relative w-full h-[360px] overflow-hidden">
<div class="w-full h-full bg-cover bg-center" data-location="Erbil, Iraq" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBRlkkJZvR3rmYN6Gsr8RcMOTmBtWs952mUf_Lk_lbPWVYQOzYo8y8zVI8Hi9VUXtnIOmixvNacAUVsnUw5QvJXr1W9OIc8GqxAKqUvhqYoN8yB-6Tqr574N5LWcIR9wnpQ31kWJoOrnbS46_8z06fwDR7VsmcBolbjb2LTKQ_Ufxu1Fp39mDT68J46U8Bq7VWO3tNpSO5xokME4D1iSbNii7J1hYi3fAHJYVpY2Ne5BBTX81T19_kf')"></div>
<!-- Soft Ambient Fog / Scrim Overlay -->
<div class="absolute inset-0 bg-gradient-to-b from-surface/80 via-surface/40 to-surface pointer-events-none"></div>
<!-- Top Floating Back Control (RTL anchored to right) -->
<div class="absolute top-4 right-margin z-10">
<button aria-label="رجوع" class="w-11 h-11 rounded-full bg-surface-white text-on-surface shadow-md flex items-center justify-center active:scale-95 transition-transform" onclick="history.back()" type="button">
<span class="material-symbols-outlined text-[22px]">arrow_forward</span>
</button>
</div>
<!-- Map Waypoint Pins (Subtle Route Context) -->
<div class="absolute top-28 right-1/4 flex flex-col items-center">
<div class="w-6 h-6 rounded-full bg-surface-white shadow-md flex items-center justify-center">
<div class="w-2.5 h-2.5 bg-on-background rounded-sm"></div>
</div>
<span class="mt-1 px-2 py-0.5 rounded-full bg-surface-white/95 text-on-surface text-[10px] font-medium shadow-sm">شارع كولان</span>
</div>
<div class="absolute top-20 left-1/4 flex flex-col items-center">
<div class="w-6 h-6 rounded-full bg-surface-white shadow-md flex items-center justify-center">
<div class="w-2.5 h-2.5 bg-primary rotate-45 rounded-[2px]"></div>
</div>
<span class="mt-1 px-2 py-0.5 rounded-full bg-surface-white/95 text-on-surface text-[10px] font-medium shadow-sm">فاميلي مول</span>
</div>
<!-- Soft connecting pulse indicator -->
<div class="absolute top-24 left-1/2 -translate-x-1/2 flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-white/90 backdrop-blur-md shadow-sm">
<span class="w-2 h-2 rounded-full bg-status-warning animate-ping"></span>
<span class="font-label-sm text-label-sm text-ink-secondary">انتهى وقت البحث</span>
</div>
</div>
<!-- Bottom Drawer Sheet -->
<div class="relative -mt-6 bg-surface-white rounded-t-[28px] shadow-[0_-8px_30px_rgba(25,27,36,0.08)] px-margin pt-3 pb-8 flex flex-col items-center">
<!-- Grab Bar -->
<div class="w-10 h-1.5 rounded-full bg-surface-container-highest mb-5"></div>
<!-- Minimalist Line Illustration: Empty Street & Vacant Silhouette -->
<div class="w-full flex justify-center mb-3">
<svg class="w-48 h-20 text-on-background" fill="none" viewbox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
<!-- Quiet Horizon Road Line -->
<path d="M10 65H190" stroke="#CFC5B6" stroke-linecap="round" stroke-width="1.75"></path>
<!-- Road Dash Markings -->
<path d="M40 73H60M90 73H110M140 73H160" stroke="#E1E1EE" stroke-linecap="round" stroke-width="2"></path>
<!-- Searching Wave Arcs (Warm Brand Accent) -->
<path d="M100 24C108 24 115 27 120 32" stroke="#715B2C" stroke-dasharray="2 4" stroke-linecap="round" stroke-width="1.75"></path>
<path d="M100 16C112 16 123 20 130 28" opacity="0.45" stroke="#715B2C" stroke-linecap="round" stroke-width="1.75"></path>
<!-- Vacant Car Silhouette -->
<path d="M68 62L74 52C75.5 49.5 78.5 48 81.5 48H118.5C121.5 48 124.5 49.5 126 52L132 62H68Z" stroke="#191B24" stroke-linejoin="round" stroke-width="1.75"></path>
<!-- Cabin Windows -->
<path d="M83 52L87 56H98V52H83Z" fill="#F3F2FF" stroke="#191B24" stroke-width="1.2"></path>
<path d="M102 52V56H113L117 52H102Z" fill="#F3F2FF" stroke="#191B24" stroke-width="1.2"></path>
<!-- Wheels -->
<circle cx="80" cy="62" fill="#FAF8FF" r="5" stroke="#191B24" stroke-width="1.75"></circle>
<circle cx="120" cy="62" fill="#FAF8FF" r="5" stroke="#191B24" stroke-width="1.75"></circle>
<circle cx="80" cy="62" fill="#715B2C" r="1.5"></circle>
<circle cx="120" cy="62" fill="#715B2C" r="1.5"></circle>
<!-- Little Signal Ripple -->
<circle cx="100" cy="38" fill="#715B2C" r="2.5"></circle>
</svg>
</div>
<!-- Title & Explanation -->
<h2 class="font-headline-md text-headline-md text-on-background text-center mb-1">
      ما لقينا كابتن متاح حالياً
    </h2>
<p class="font-body-md text-body-md text-ink-secondary text-center mb-5">
      جرّب مرة أخرى أو اختر فئة أخرى
    </p>
<!-- Request Summary Badge -->
<div class="w-full flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl bg-surface-inset text-on-surface mb-6">
<span class="w-2 h-2 rounded-full bg-primary flex-shrink-0"></span>
<span class="font-label-md text-label-md truncate">اقتصادي · <span dir="ltr">3,000</span> د.ع · شارع كولان إلى فاميلي مول</span>
</div>
<!-- Actions -->
<div class="w-full flex flex-col gap-3">
<!-- Primary Retry Button -->
<button class="w-full h-[52px] rounded-xl bg-primary-container text-on-primary-fixed font-label-lg text-label-lg flex items-center justify-center gap-2 active:scale-[0.99] transition-all" id="retry-ride-btn" type="button">
<span class="material-symbols-outlined text-[20px]">refresh</span>
<span>حاول مرة أخرى</span>
</button>
<!-- Secondary Change Category Button -->
<button class="w-full h-[52px] rounded-xl bg-surface-container-low text-on-background font-label-lg text-label-lg flex items-center justify-center gap-2 active:scale-[0.99] transition-all" id="change-category-btn" type="button">
<span class="material-symbols-outlined text-[20px]">local_taxi</span>
<span>تغيير الفئة</span>
</button>
</div>
<!-- Helpful Local Status Cue -->
<div class="mt-5 flex items-center gap-1.5 text-ink-secondary">
<span class="material-symbols-outlined text-[16px]">info</span>
<span class="font-body-sm text-body-sm">حركة السير مزدحمة بالقرب من شارع كولان</span>
</div>
</div>
</div>
<script>
  (function() {
    const retryBtn = document.getElementById('retry-ride-btn');
    if (retryBtn) {
      retryBtn.addEventListener('click', function() {
        const icon = this.querySelector('.material-symbols-outlined');
        if (icon) {
          icon.classList.add('animate-spin');
          setTimeout(() => {
            icon.classList.remove('animate-spin');
          }, 1200);
        }
      });
    }
  })();
</script></main></body></html>
